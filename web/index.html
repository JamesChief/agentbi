<!DOCTYPE html>
<html lang="{{html.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{site.title}}</title>
<meta name="description" content="{{og.home_desc}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{og.site_name}}">
<meta property="og:title" content="{{og.home_title}}">
<meta property="og:description" content="{{og.home_desc}}">
<meta property="og:url" content="https://agentbi.tech/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{og.home_title}}">
<meta name="twitter:description" content="{{og.home_desc}}">
<link rel="canonical" href="https://agentbi.tech/">
<link rel="alternate" hreflang="en" href="https://agentbi.tech/">
<link rel="alternate" hreflang="zh" href="https://agentbi.tech/?lang=zh">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>AgentBI</h1>
<p class="sub">{{site.sub}}</p>

<form id="f">
  <input id="u" type="text" placeholder="{{site.placeholder}}" autocomplete="off" required>
  <button type="submit">{{site.button}}</button>
</form>
<p class="sub"><a href="/leaderboard{{qs}}">{{site.lb_link}}</a></p>
<p class="sub">
  <a href="/trend{{qs}}">{{site.tr_link}}</a> ·
  <a href="/protocols{{qs}}">{{site.pr_link}}</a> ·
  <a href="/crawlers{{qs}}">{{site.cr_link}}</a>
</p>

<div id="out"></div>

<footer>
  <p>{{site.checks}} <a href="https://github.com/JamesChief/agentbi">github.com/JamesChief/agentbi</a></p>
  <p><a href="/about{{qs}}">{{site.about_link}}</a> ·
     <a href="https://github.com/JamesChief/agentbi/issues">{{site.issues_link}}</a> ·
     <a href="{{alt_href}}">{{alt_lang}}</a></p>
</footer>

<script>
const L = {{json.lang}};
const QS = {{json.qs}};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = k => L[k] !== undefined ? L[k] : k;
const fill = (s, kv) => Object.entries(kv).reduce((a,[k,v]) => a.replace('{'+k+'}', v), s);

function scoreClass(s){ return s>=80?'good':s>=50?'mid':'bad'; }

function render(r){
  if (r.error) return `<div class="err">✗ ${esc(r.error)}</div>`;
  const d = r.detail || {};
  const rows = ['fetch','structured','ucp','llms','robots']
    .filter(k => d[k] !== undefined)
    .map(k => `<tr><td>${esc(T('dim.'+k))}</td><td>${esc(d[k])}</td></tr>`).join('');

  let probe = '';
  if (r.probe && !r.probe.skipped) {
    if (r.probe.inconclusive) {
      probe = `<p class="note">⚠ ${esc(r.probe.note || '')}</p>`;
    } else if (r.probe.agents) {
      const ag = Object.entries(r.probe.agents)
        .map(([n,v]) => `<tr><td>${esc(n)}</td><td>${v.status}</td>`+
             `<td>${v.readable?esc(T('rep.readable')):'—'}</td>`+
             `<td>${v.status==200?esc(T('rep.ok')):esc(T('rep.blocked'))}</td></tr>`).join('');
      probe = `<h3>${esc(T('rep.probe'))}</h3><table>`+
              `<tr><th>${esc(T('rep.ua'))}</th><th>${esc(T('rep.status'))}</th>`+
              `<th>${esc(T('rep.product'))}</th><th>${esc(T('rep.result'))}</th></tr>${ag}</table>`;
    }
  }

  let ucp = '';
  if (r.ucp && r.ucp.present) {
    const svc = Object.entries(r.ucp.services).map(([n,es]) =>
      `<tr><td>${esc(n)}</td><td>${esc((es[0]||{}).version||'')}</td>`+
      `<td>${esc((es[0]||{}).transport||'')}</td></tr>`).join('');
    ucp = `<h3>${esc(T('rep.ucp_title'))}</h3>`+
          `<p>${esc(fill(T('rep.ucp_current'),
                         {v:r.ucp.version, versions:(r.ucp.supported_versions||[]).join(' / ')}))}</p>`+
          `<table><tr><th>${esc(T('rep.service'))}</th><th>${esc(T('rep.version'))}</th>`+
          `<th>${esc(T('rep.transport'))}</th></tr>${svc}</table>`;
  }

  const fixes = (r.fixes||[]).map(f =>
    `<li><span class="pri pri-${esc(f[1])}">${esc(T('pri.'+f[1]))}</span> <b>${esc(f[0])}</b><br>${esc(f[2])}</li>`).join('');

  return `
    <div class="score ${scoreClass(r.score)}">${r.score}<span>/100</span></div>
    <p class="sub">${esc(T('rep.checked'))} <code>${esc(r.checked_url)}</code>（${esc(r.checked_kind)}）</p>
    <table class="dim">${rows}</table>
    ${ucp}${probe}
    ${fixes?`<h3>${esc(T('rep.fixes'))}</h3><ul class="fix">${fixes}</ul>`:''}`;
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const url = document.getElementById('u').value.trim();
  const out = document.getElementById('out');
  out.innerHTML = '<p class="note">' + esc(T('site.scanning')) + '</p>';
  try {
    const res = await fetch('/api/check?url=' + encodeURIComponent(url) + QS);
    const j = await res.json();
    if (j.error) { out.innerHTML = `<div class="err">✗ ${esc(j.error)}</div>`; return; }
    out.innerHTML = render(j.result) + (j.cached ? `<p class="note">${esc(T('site.cached'))}</p>` : '');
  } catch (err) {
    out.innerHTML = `<div class="err">✗ ${esc(fill(T('site.req_failed'), {err:err.message}))}</div>`;
  }
});
</script>
</body>
</html>
